; Пример dialplan для Asterisk.
;
; 1. Замените BACKEND_URL и TELEPHONY_TOKEN.
; 2. Подключите файл из extensions.conf через #include или скопируйте
;    содержимое.
; 3. Перезагрузите dialplan: asterisk -rx "dialplan reload".
;
; Запись разговора делает MixMonitor, а после завершения звонка curl
; отправляет WAV в backend. Backend сам расшифрует запись и создаст заявку.

[globals]
BACKEND_URL=http://web:8000
TELEPHONY_TOKEN=change-me

[from-trunk]
exten => _X.,1,NoOp(Inbound call from ${CALLERID(num)})
 same => n,Answer()
 same => n,Set(REC=/var/spool/asterisk/monitor/${UNIQUEID}.wav)
 same => n,MixMonitor(${REC},b)
 same => n,Dial(PJSIP/1001,30)
 same => n,Hangup()

; Звонки, инициированные изнутри (если нужно записывать и их).
exten => h,1,NoOp(Call ${UNIQUEID} finished)
 same => n,System(curl -s -X POST ${BACKEND_URL}/api/telephony/sip/recording -H "X-Telephony-Token: ${TELEPHONY_TOKEN}" -F "external_id=${UNIQUEID}" -F "from_number=${CALLERID(num)}" -F "direction=inbound" -F "file=@${REC}" >/dev/null 2>&1)

[from-internal]
exten => _X.,1,NoOp(Outbound call to ${EXTEN})
 same => n,Set(REC=/var/spool/asterisk/monitor/${UNIQUEID}.wav)
 same => n,MixMonitor(${REC},b)
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

exten => h,1,NoOp(Call ${UNIQUEID} finished)
 same => n,System(curl -s -X POST ${BACKEND_URL}/api/telephony/sip/recording -H "X-Telephony-Token: ${TELEPHONY_TOKEN}" -F "external_id=${UNIQUEID}" -F "direction=outbound" -F "file=@${REC}" >/dev/null 2>&1)

; Dialplan для ARI-режима.
;
; Backend сам отвечает на канал, включает запись и забирает её через ARI.
; Никаких MixMonitor/curl здесь не нужно.
;
; Имя приложения (dispatchai) должно совпадать с ARI_APP в backend/.env.

[from-trunk]
exten => _X.,1,NoOp(Inbound call from ${CALLERID(num)})
 same => n,Answer()
 same => n,Stasis(dispatchai)
 same => n,Hangup()

[from-internal]
exten => _X.,1,NoOp(Outbound call to ${EXTEN})
 same => n,Answer()
 same => n,Stasis(dispatchai)
 same => n,Hangup()

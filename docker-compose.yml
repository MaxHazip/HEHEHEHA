services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: dispatcher_user
      POSTGRES_PASSWORD: ef6a998e815ad6513ffe2f4a749208f3e269f24b43384d03f9acb2f5cb343169
      POSTGRES_DB: dispatcher_db
    ports:
      - "5432:5432" 
    volumes:
      - postgres_data:/var/lib/postgresql/data 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d course_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  test_db:
    image: postgres:15-alpine
    container_name: test_course_db

    restart: unless-stopped

    environment:
      POSTGRES_DB: test_tasks_db
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpassword 

    ports:
     - "5433:5432"

  web:
    build: . 
    restart: always
    ports:
      - "8000:8000"
    environment:
      
      DATABASE_URL: postgresql+asyncpg://tasks_user:taskssecret@db:5432/tasks_db
    depends_on:
      db:
        condition: service_healthy

    command: sh -c "sleep 3 && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data: